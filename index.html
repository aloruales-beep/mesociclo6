<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><meta name="description" content="Registro de hipertrofia por series del sexto mesociclo"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><title>Mesociclo 6 · Libro Maestro</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf4fa;background:#0b1726;font-size:15px}*{box-sizing:border-box}body{margin:0;padding-bottom:90px}header{background:linear-gradient(115deg,#143b4f,#102a43);padding:22px 16px 16px;border-bottom:1px solid #2a5063}h1{font-size:23px;margin:0 0 5px}h2{font-size:19px;margin:10px 0}h3{font-size:16px;margin:0 0 8px}.muted,small{color:#a5bac9}main{max-width:850px;margin:auto;padding:16px}.card{background:#162a3c;border:1px solid #28445a;border-radius:15px;padding:15px;margin-bottom:13px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#20384c;border-radius:10px;padding:11px}.stat b{display:block;font-size:23px;color:#64e2cb}.stat small{display:block}label{display:block;color:#b9cedb;font-size:12px;margin-bottom:4px}input,select,textarea{background:#0b1d2d;border:1px solid #466174;border-radius:9px;color:white;padding:10px;min-width:0;width:100%;font-size:16px}textarea{min-height:66px}button{border:0;background:#20b59f;color:#042a29;font-weight:750;padding:11px 14px;border-radius:10px;cursor:pointer;font-size:14px}button.secondary{background:#294b60;color:#eaf4fa}button.warn{background:#6a3543;color:#fff}button:disabled{opacity:.45}nav{position:fixed;bottom:0;left:0;right:0;background:#10283b;border-top:1px solid #385266;display:flex;justify-content:space-around;padding:8px 2px max(8px,env(safe-area-inset-bottom));z-index:10}nav button{background:transparent;color:#b4cad8;font-size:12px;padding:8px 4px;min-width:18%}nav button.active{color:#65e8cf;background:#1b3d50}.exercise{border-top:1px solid #365066;padding-top:13px;margin-top:13px}.series{display:grid;grid-template-columns:42px repeat(4,minmax(0,1fr));gap:6px;align-items:end;margin:9px 0}.series input{padding:8px 4px;text-align:center;font-size:15px}.series label{text-align:center;font-size:11px}.pill{background:#29475a;padding:4px 8px;border-radius:8px;font-size:12px;color:#b9d9e6}.warning{border-left:4px solid #e6b566;padding-left:12px}.hidden{display:none!important}.progress{height:8px;background:#314b5b;border-radius:8px;overflow:hidden}.progress span{display:block;height:100%;background:#26b99f}.timer{font-size:31px;font-weight:800;font-variant-numeric:tabular-nums}a{color:#72dfcc}.setnum{font-weight:700;text-align:center;padding-bottom:12px}.tiny{font-size:12px;color:#aac2d0} @media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}main{padding:22px}}
</style></head><body><header><div style="max-width:850px;margin:auto"><small>LIBRO MAESTRO · VERSIÓN 2</small><h1>Mesociclo 6 · Hipertrofia I</h1><div class="muted">8 semanas · Lunes / Miércoles / Viernes · Bicicleta domingo</div></div></header><main id="view"></main><nav id="nav"></nav><script>
const PLAN=[{"day": "Lunes", "name": "Sentadilla con barra", "sets": 3, "min": 8, "max": 10, "rir": "3", "rest": 150, "load": "45", "notes": "ROM consistente"}, {"day": "Lunes", "name": "Jalón al pecho", "sets": 3, "min": 8, "max": 12, "rir": "3", "rest": 120, "load": "30", "notes": "Sin dolor"}, {"day": "Lunes", "name": "Extensión cuádriceps multifuerza", "sets": 2, "min": 12, "max": 15, "rir": "3", "rest": 90, "load": "", "notes": "Calibrar"}, {"day": "Lunes", "name": "Remo polea baja", "sets": 2, "min": 10, "max": 12, "rir": "3", "rest": 105, "load": "23", "notes": "Sin balanceo"}, {"day": "Lunes", "name": "Curl femoral de pie unilateral", "sets": 2, "min": 10, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Por pierna"}, {"day": "Lunes", "name": "Curl bíceps barra Z/polea", "sets": 2, "min": 10, "max": 12, "rir": "3", "rest": 90, "load": "16", "notes": "Sin compensación"}, {"day": "Lunes", "name": "Pantorrillas", "sets": 2, "min": 12, "max": 20, "rir": "3", "rest": 75, "load": "", "notes": "Pausa arriba"}, {"day": "Miércoles", "name": "Hip thrust", "sets": 3, "min": 8, "max": 12, "rir": "3", "rest": 120, "load": "52.5", "notes": "Pausa arriba"}, {"day": "Miércoles", "name": "Remo polea baja", "sets": 3, "min": 8, "max": 12, "rir": "3", "rest": 120, "load": "23", "notes": "Espalda estable"}, {"day": "Miércoles", "name": "Step-up", "sets": 2, "min": 10, "max": 12, "rir": "3", "rest": 90, "load": "", "notes": "Por pierna"}, {"day": "Miércoles", "name": "Pullover unilateral polea", "sets": 2, "min": 12, "max": 15, "rir": "3", "rest": 90, "load": "4.5", "notes": "Sin dolor"}, {"day": "Miércoles", "name": "Elevación lateral polea", "sets": 2, "min": 12, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Solo si tolerable"}, {"day": "Miércoles", "name": "Extensión tríceps polea", "sets": 2, "min": 10, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Solo si tolerable"}, {"day": "Viernes", "name": "Sentadilla moderada", "sets": 2, "min": 10, "max": 12, "rir": "3", "rest": 120, "load": "40", "notes": "ROM completo"}, {"day": "Viernes", "name": "Jalón al pecho", "sets": 2, "min": 10, "max": 12, "rir": "3", "rest": 120, "load": "30", "notes": "Sin dolor"}, {"day": "Viernes", "name": "Curl femoral de pie unilateral", "sets": 3, "min": 12, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Por pierna"}, {"day": "Viernes", "name": "Extensión cuádriceps multifuerza", "sets": 2, "min": 12, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Control"}, {"day": "Viernes", "name": "Face pull", "sets": 2, "min": 12, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Solo si tolerable"}, {"day": "Viernes", "name": "Curl bíceps", "sets": 2, "min": 10, "max": 15, "rir": "3", "rest": 75, "load": "", "notes": "Sin compensación"}, {"day": "Viernes", "name": "Pantorrillas", "sets": 2, "min": 12, "max": 20, "rir": "3", "rest": 75, "load": "", "notes": "Control"}];const WEEK8={"Lunes|Sentadilla con barra": 2, "Lunes|Jalón al pecho": 2, "Lunes|Extensión cuádriceps multifuerza": 1, "Lunes|Remo polea baja": 1, "Lunes|Curl femoral de pie unilateral": 1, "Lunes|Curl bíceps barra Z/polea": 1, "Lunes|Pantorrillas": 1, "Miércoles|Hip thrust": 2, "Miércoles|Remo polea baja": 2, "Miércoles|Step-up": 1, "Miércoles|Pullover unilateral polea": 1, "Miércoles|Elevación lateral polea": 1, "Miércoles|Extensión tríceps polea": 1, "Viernes|Sentadilla moderada": 1, "Viernes|Jalón al pecho": 1, "Viernes|Curl femoral de pie unilateral": 2, "Viernes|Extensión cuádriceps multifuerza": 1, "Viernes|Face pull": 1, "Viernes|Curl bíceps": 1, "Viernes|Pantorrillas": 1};const MEASURES={"Peso": "71", "Cintura": "90", "Pecho": "102", "Brazo derecho relajado": "33", "Brazo derecho contraído": "34", "Brazo izquierdo relajado": "33", "Brazo izquierdo contraído": "34", "Muslo derecho": "54", "Muslo izquierdo": "54", "Pantorrilla derecha": "36", "Pantorrilla izquierda": "36", "Cadera": "94"};const KEY='mesociclo6_v2_datos';
const DAYS=['Lunes','Miércoles','Viernes'];const TABS=[['inicio','Inicio'],['entreno','Entreno'],['bienestar','Bienestar'],['medidas','Medidas'],['datos','Datos']];
const fresh=()=>({version:2,sets:{},sessions:{},wellness:{},measures:{inicio:{...MEASURES},final:{}},settings:{}});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){db=fresh()};if(!db.sets)db=fresh();let tab='inicio',week=1,day='Lunes',timerEnd=0,timerHandle=null,remaining=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('No se pudieron guardar los datos. Exporta un respaldo y revisa el espacio del dispositivo.');return false}};
const sid=(w,d)=>`${w}|${d}`;const eid=(w,d,n,i)=>`${w}|${d}|${n}|${i}`;
const target=(w,x)=>w===8?(WEEK8[x.day+'|'+x.name]??Math.max(1,Math.ceil(x.sets/2))):x.sets;
const num=v=>{let n=Number(String(v??'').replace(',','.'));return Number.isFinite(n)?n:0};
const count=()=>Object.values(db.sets).filter(s=>s&&s.done).length;
const countSessions=()=>Object.values(db.sessions).filter(s=>s&&s.done).length;
const heading=(t,sub='')=>`<h2>${t}</h2>${sub?`<p class="muted">${sub}</p>`:''}`;
function navigate(t){tab=t;render();window.scrollTo(0,0)}
function render(){document.getElementById('nav').innerHTML=TABS.map(([id,n])=>`<button class="${tab===id?'active':''}" onclick="navigate('${id}')">${n}</button>`).join('');document.getElementById('view').innerHTML=({inicio:home,entreno:workout,bienestar:wellness,medidas:measure,datos:dataView})[tab]();}
function home(){let total=0;for(let w=1;w<=8;w++)for(let d of DAYS)for(let x of PLAN.filter(a=>a.day===d))total+=target(w,x);return `${heading('Tu progreso','Registro individual de cada serie, con guardado automático en este dispositivo.')}
<div class="grid"><div class="stat"><small>Sesiones completadas</small><b>${countSessions()}/24</b></div><div class="stat"><small>Series realizadas</small><b>${count()}/${total}</b></div><div class="stat"><small>Semana seleccionada</small><b>${week}/8</b></div><div class="stat"><small>Objetivo</small><b style="font-size:17px">Hipertrofia</b></div></div>
<div class="card"><h3>Próxima sesión</h3><p>Selecciona semana y día en la pestaña Entreno. Cada serie guarda carga, repeticiones, RIR, dolor, técnica y notas.</p><button onclick="navigate('entreno')">Abrir entrenamiento →</button></div>
<div class="card warning"><h3>Hombro izquierdo</h3><p>Evita presses y aperturas dolorosos. Como hay molestias también en actividades cotidianas, solicita valoración por fisioterapia o medicina deportiva antes de reintroducir cargas de empuje. Los demás ejercicios solo si son tolerables.</p></div>
<div class="card"><h3>Plan semanal</h3><p><b>Lunes:</b> cuerpo completo A · <b>Miércoles:</b> cuerpo completo B · <b>Viernes:</b> cuerpo completo C · <b>Domingo:</b> bicicleta 120 minutos, preferentemente zona 2.</p><p class="tiny">Semana 8: descarga, con aproximadamente la mitad de series. Los registros del mesociclo 5 no se modifican.</p></div>`}
function workout(){let ex=PLAN.filter(x=>x.day===day);let total=ex.reduce((a,x)=>a+target(week,x),0),done=ex.reduce((a,x)=>a+Array.from({length:target(week,x)},(_,i)=>db.sets[eid(week,day,x.name,i+1)]?.done?1:0).reduce((a,b)=>a+b,0),0);let s=db.sessions[sid(week,day)]||{};
return `${heading('Entrenamiento','Cada campo se guarda automáticamente al modificarlo.')}
<div class="card"><div class="grid"><div><label>Semana</label><select onchange="week=Number(this.value);render()">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>Semana ${i+1}</option>`).join('')}</select></div><div><label>Día</label><select onchange="day=this.value;render()">${DAYS.map(d=>`<option ${day===d?'selected':''}>${d}</option>`).join('')}</select></div></div><p><b>${done}/${total}</b> series registradas ${week===8?'· DESCARGA':''}</p><div class="progress"><span style="width:${total?done/total*100:0}%"></span></div></div>
<div class="card"><div class="flex"><div><small>DESCANSO ENTRE SERIES</small><div class="timer" id="timer">${fmtTime(remaining)}</div></div><div><button class="secondary" onclick="startTimer(60)">1 min</button> <button class="secondary" onclick="startTimer(90)">1:30</button> <button class="secondary" onclick="startTimer(120)">2 min</button> <button class="secondary" onclick="startTimer(150)">2:30</button></div></div><p class="tiny">El cronómetro funciona mientras la aplicación permanezca abierta. El sistema puede suspenderlo en segundo plano.</p></div>
${ex.map(x=>exercise(x)).join('')}
<div class="card"><h3>Resumen de sesión</h3><div class="grid"><div><label>Duración (min)</label><input type="number" min="0" value="${esc(s.duration??'')}" onchange="sessionField('duration',this.value)"></div><div><label>¿Sesión completada?</label><select onchange="sessionField('done',this.value==='true')"><option value="false">Pendiente</option><option value="true" ${s.done?'selected':''}>Sí, terminada</option></select></div></div><label style="margin-top:10px">Notas de la sesión</label><textarea onchange="sessionField('notes',this.value)">${esc(s.notes??'')}</textarea><p class="tiny">Marca la sesión como terminada al completar tu entrenamiento. Las series ya se guardan por separado.</p></div>`}
function exercise(x){let t=target(week,x);return `<div class="card"><div class="flex"><h3>${esc(x.name)}</h3><span class="pill">${t} series · ${x.min}–${x.max} reps</span></div><p class="tiny">RIR objetivo ${esc(x.rir)} · Descanso ${x.rest} s ${x.load?'· Carga orientativa '+esc(x.load)+' kg':''} · ${esc(x.notes)}</p><div class="series"><div></div><label>kg</label><label>Reps</label><label>RIR</label><label>Dolor 0–10</label></div>${Array.from({length:t},(_,i)=>seriesRow(x,i+1)).join('')}</div>`}
function seriesRow(x,i){let k=eid(week,day,x.name,i),s=db.sets[k]||{};return `<div class="series"><div class="setnum">${i}</div>${['load','reps','rir','pain'].map(f=>`<input aria-label="${f} serie ${i} ${esc(x.name)}" type="number" step="${f==='load'?'0.25':'1'}" min="0" ${f==='pain'?'max="10"':''} value="${esc(s[f]??'')}" onchange="setField('${encodeURIComponent(k)}','${f}',this.value)">`).join('')}</div><div class="flex"><div style="flex:1;min-width:150px"><label>Técnica / recorrido</label><select onchange="setField('${encodeURIComponent(k)}','rom',this.value)">${['Sin evaluar','Completo/objetivo','Parcial','Técnica alterada'].map(v=>`<option ${s.rom===v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>Serie realizada</label><input aria-label="Serie realizada" type="checkbox" style="width:24px;height:24px" ${s.done?'checked':''} onchange="setField('${encodeURIComponent(k)}','done',this.checked)"></div></div><label style="margin-top:8px">Observación serie ${i}</label><input placeholder="Ej.: hombro sin dolor, recorrido correcto" value="${esc(s.notes??'')}" onchange="setField('${encodeURIComponent(k)}','notes',this.value)"><div style="height:12px"></div>`}
function setField(encoded,f,v){let k=decodeURIComponent(encoded);db.sets[k]??={};db.sets[k][f]=v;save();if(f==='done')render()}
function sessionField(f,v){let k=sid(week,day);db.sessions[k]??={};db.sessions[k][f]=v;save();if(f==='done')render()}
function startTimer(s){remaining=s;timerEnd=Date.now()+s*1000;if(timerHandle)clearInterval(timerHandle);timerHandle=setInterval(()=>{remaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));let el=document.getElementById('timer');if(el)el.textContent=fmtTime(remaining);if(!remaining){clearInterval(timerHandle);timerHandle=null;if(navigator.vibrate)navigator.vibrate([150,100,150])}},250);let el=document.getElementById('timer');if(el)el.textContent=fmtTime(remaining)}
function fmtTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function wellness(){let w=db.wellness[week]||{};let fields=[['peso','Peso corporal (kg)','number'],['sueno','Sueño (horas)','number'],['energia','Energía (1–5)','number'],['fatiga','Fatiga (0–10)','number'],['hombro','Molestia hombro (0–10)','number'],['lumbar','Molestia lumbar (0–10)','number'],['bici','Bicicleta domingo (min)','number'],['intensidad','Intensidad bicicleta','text']];return `${heading('Bienestar y ciclismo','Registro semanal de recuperación y cardio.')}
<div class="card"><label>Semana</label><select onchange="week=Number(this.value);render()">${Array.from({length:8},(_,i)=>`<option value="${i+1}" ${week===i+1?'selected':''}>Semana ${i+1}</option>`).join('')}</select></div><div class="card"><div class="grid">${fields.map(([id,label,type])=>`<div><label>${label}</label><input type="${type}" ${type==='number'?'step="0.1" min="0"':''} value="${esc(w[id]??'')}" onchange="wellField('${id}',this.value)"></div>`).join('')}</div><label style="margin-top:12px">Observaciones</label><textarea onchange="wellField('notes',this.value)">${esc(w.notes??'')}</textarea></div>`}
function wellField(f,v){db.wellness[week]??={};db.wellness[week][f]=v;save()}
function measure(){let names=Object.keys(MEASURES);return `${heading('Medidas corporales','Los valores iniciales proceden del Excel aprobado; confirma las mediciones antes de comenzar.')}
<div class="card"><div class="grid"><div><b>Medida</b></div><div><b>Inicio / Final</b></div></div>${names.map(n=>`<div style="border-top:1px solid #2d4a60;padding-top:10px;margin-top:10px"><b>${esc(n)}</b><div class="grid" style="margin-top:6px"><div><label>Inicio</label><input type="number" step="0.1" value="${esc(db.measures.inicio?.[n]??'')}" onchange="measureField('inicio','${esc(n)}',this.value)"></div><div><label>Final</label><input type="number" step="0.1" value="${esc(db.measures.final?.[n]??'')}" onchange="measureField('final','${esc(n)}',this.value)"></div></div></div>`).join('')}</div>`}
function measureField(p,n,v){db.measures[p]??={};db.measures[p][n]=v;save()}
function dataView(){return `${heading('Tus datos','Los registros se guardan únicamente en este navegador y dispositivo. No se sincronizan con Excel ni con GitHub.')}
<div class="card"><h3>Copias de seguridad</h3><p>Exporta JSON para conservar <b>todos</b> los registros. Exporta CSV para abrir las series en Excel. Haz respaldos periódicos.</p><div class="flex"><button onclick="exportJSON()">Exportar JSON</button><button class="secondary" onclick="exportCSV()">Exportar CSV</button></div><hr style="border-color:#365066;margin:17px 0"><label>Restaurar un respaldo JSON del Mesociclo 6</label><input type="file" accept=".json,application/json" onchange="importJSON(this)"></div>
<div class="card"><h3>Resumen</h3><p>Series realizadas: <b>${count()}</b> · Sesiones finalizadas: <b>${countSessions()}</b></p><p class="tiny">Esta es una aplicación independiente de Mesociclo 5. La importación reemplaza los datos de Mesociclo 6, no los del 5.</p><button class="warn" onclick="clearData()">Borrar todos los datos del Mesociclo 6</button></div><div class="card warning"><b>Uso responsable</b><p>Las cargas iniciales son orientativas. No fuerces ejercicios dolorosos ni ignores cambios en tus síntomas.</p></div>`}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJSON(){download('mesociclo6_respaldo.json',JSON.stringify(db,null,2),'application/json')}
function csvCell(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}
function exportCSV(){let rows=[['Semana','Día','Ejercicio','Serie','Carga kg','Repeticiones','RIR','Dolor','ROM','Observaciones','Realizada']];for(let w=1;w<=8;w++)for(let d of DAYS)for(let x of PLAN.filter(x=>x.day===d))for(let i=1;i<=target(w,x);i++){let s=db.sets[eid(w,d,x.name,i)]||{};rows.push([w,d,x.name,i,s.load,s.reps,s.rir,s.pain,s.rom,s.notes,s.done?'Sí':'No'])}download('mesociclo6_series.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')}
async function importJSON(el){let file=el.files?.[0];if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.version!==2||!obj.sets||!obj.sessions||!obj.wellness||!obj.measures)throw Error('Formato no válido para Mesociclo 6');if(!confirm('Esto reemplazará TODOS los registros actuales del Mesociclo 6. ¿Continuar?'))return;db=obj;save();render();alert('Respaldo restaurado correctamente')}catch(e){alert('No se pudo importar: '+e.message)}finally{el.value=''}}
function clearData(){if(confirm('¿Borrar todos los registros del Mesociclo 6? Exporta un JSON antes.'))if(confirm('Confirmación final: esta acción no se puede deshacer sin un respaldo.')){db=fresh();save();render()}}
render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
